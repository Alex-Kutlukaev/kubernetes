---
# https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.converter.name}}-deployment
spec:
  selector:
    matchLabels:
      components: {{ .Values.converter.components}}
  replicas: 1
  template:
    metadata:
      labels:
        components: {{ .Values.converter.components}}
    spec:
      containers:
        - name: {{ .Values.converter.name}}
          image: "{{ .Values.converter.image}}:{{ .Values.converter.version}}"
          ports:
            - containerPort: {{ .Values.converter.port}}
          resources:
            requests:
              memory: {{ .Values.converter.requests.memory}}
              cpu: {{ .Values.converter.requests.cpu}}
            limits:
              memory: {{ .Values.converter.limits.memory}}
              cpu: {{ .Values.converter.limits.cpu}}
          env:
            - name: AMQP_EXCHANGE
              valueFrom:
                secretKeyRef:
                  key: AMQP_EXCHANGE
                  name: rabbitmq-secret
            - name: AMQP_USER
              valueFrom:
                secretKeyRef:
                  key: AMQP_USER
                  name: rabbitmq-secret
            - name: AMQP_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: AMQP_PASSWORD
                  name: rabbitmq-secret
            - name: AMQP_HOSTNAME
              valueFrom:
                secretKeyRef:
                  key: AMQP_HOSTNAME
                  name: rabbitmq-secret
            - name: AMQP_QUEUE
              valueFrom:
                secretKeyRef:
                  key: AMQP_QUEUE
                  name: rabbitmq-secret
