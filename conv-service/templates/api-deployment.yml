---
# https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.api.name}}-deployment
spec:
  selector:
    matchLabels:
      components: {{ .Values.api.components}}
  replicas: 1
  template:
    metadata:
      labels:
        components: {{ .Values.api.components}}
    spec:
      containers:
        - name: {{ .Values.api.components}}
          image: "{{ .Values.api.image}}:{{ .Values.api.image}}"
          ports:
            - containerPort: {{ .Values.api.port}}
          resources:
            limits:
              memory: {{ .Values.api.limits.memory}}
              cpu: {{ .Values.api.limits.cpu}}
          env:
            - name: AMQP_EXCHANGE
              valueFrom:
                secretKeyRef:
                  key: AMQP_EXCHANGE
                  name: rabbitmq-secret
            - name: AMQP_USER
              valueFrom:
                secretKeyRef:
                  key: AMQP_USER
                  name: rabbitmq-secret
            - name: AMQP_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: AMQP_PASSWORD
                  name: rabbitmq-secret
            - name: AMQP_HOSTNAME
              valueFrom:
                secretKeyRef:
                  key: AMQP_HOSTNAME
                  name: rabbitmq-secret
          volumeMounts:
            - mountPath: /opt/app/uploads
              name: conv-api-data
      volumes:
        - name: conv-api-data
          persistentVolumeClaim:
            claimName: conv-api-pvc
