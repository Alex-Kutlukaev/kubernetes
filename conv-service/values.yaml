app:
  name: conv-app
  image: antonlarichev/conv-app
  version: 1.2
  components: frontend
  port: 80
  limits:
    memory: "500Mi"
    cpu: "200m"

ingress:
  name: myingress
  port: 3000

api:
  name: conv-api
  image: antonlarichev/conv-api
  version: 1.0
  components: backend
  port: 3000
  limits:
    memory: "500Mi"
    cpu: "200m"

converter:
  name: conv-service
  components: service
  port: 4000
  image: antonlarichev/conv-service
  version: 1.0
  limits:
    memory: "512Mi"
    cpu: "500m"
  requests:
    memory: "128Mi"
    cpu: "100m"

rabbitmq:
  name: rabbitmq
  image: rabbitmq
  version: 3.7.3
  limits:
    memory: "128Mi"
    cpu: "500m"
  port: 5672
  stringData:
    AMQP_EXCHANGE: "demo"
    AMQP_USER: "demo"
    AMQP_PASSWORD: "demo"
    AMQP_HOSTNAME: "rabbitmq-clusterip"
    AMQP_QUEUE: "converter"